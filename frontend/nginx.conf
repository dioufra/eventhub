server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log off;                  # la gateway journalise déjà les accès
    error_log  /dev/stderr warn;

    location = /health {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage côté client de l'application Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}