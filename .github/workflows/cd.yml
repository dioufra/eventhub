name: CD

# Uniquement sur main : c'est la branche de production.
on:
  push:
    branches: [main]
  # Permet aussi un déclenchement manuel depuis l'onglet Actions.
  workflow_dispatch:

# ATTENTION : ne PAS nommer cette variable « REGISTRY ».
# Docker Compose donne la priorité aux variables d'environnement du shell
# sur le fichier .env. Une variable REGISTRY définie ici écraserait
# silencieusement celle du .env, et les images seraient cherchées au
# mauvais endroit — sans aucun message d'avertissement.
env:
  GHCR_HOST: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/eventhub

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ===========================================================================
  # JOB 1 — TESTS : on ne publie jamais sans revalider
  # ===========================================================================
  test:
    name: Tests · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true          # sur main, le premier échec arrête tout
      matrix:
        service: [events-service, participants-service, registrations-service]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Installation des dépendances
        working-directory: ${{ matrix.service }}
        run: pip install -r requirements-dev.txt

      - name: Tests unitaires
        working-directory: ${{ matrix.service }}
        run: pytest -q

  # ===========================================================================
  # JOB 2 — BUILD ET PUBLICATION SUR GHCR
  # ===========================================================================
  build-and-push:
    name: Publication · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test

    # Autorisations minimales : principe du moindre privilège.
    # Sans « packages: write », le push échoue en 403.
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - events-service
          - participants-service
          - registrations-service
          - frontend
          - gateway

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN est fourni automatiquement : aucun secret à créer,
      # contrairement à Docker Hub qui exigerait un compte et un token.
      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Produit plusieurs tags d'un coup. Le tag « sha- » est le plus
      # précieux : il relie une image en production à un commit exact.
      - name: Calcul des tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GHCR_HOST }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Construction et publication
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ===========================================================================
  # JOB 3 — DÉPLOIEMENT
  #
  # Faute de serveur dédié, le déploiement s'exécute sur le runner GitHub
  # À PARTIR DES IMAGES PUBLIÉES sur GHCR — ce n'est donc pas une
  # simulation : la pile de production est réellement démarrée, puis
  # soumise aux tests de recette. Le script SSH pour un serveur réel est
  # fourni en commentaire à la fin de ce fichier.
  # ===========================================================================
  deploy:
    name: Déploiement et recette
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      contents: read
      packages: read

    # Valeurs lues par docker compose. Définies ici, au niveau du job, donc
    # sans ambiguïté : elles priment sur le fichier .env, c'est voulu.
    env:
      REGISTRY: ghcr.io/${{ github.repository_owner }}
      TAG: latest

    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_HOST }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Préparation de l'environnement
        run: |
          cp .env.example .env
          # REGISTRY et TAG ne sont PAS écrits ici : ils sont fournis par
          # l'environnement du job, qui prime sur ce fichier.
          {
            echo "POSTGRES_USER=eventhub"
            echo "POSTGRES_PASSWORD=$(openssl rand -base64 24)"
            echo "GATEWAY_PORT=8080"
          } >> .env

      - name: Les images attendues portent-elles le bon nom ?
        run: |
          set -e
          attendues=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml config \
                        | grep -oP 'image: \Kghcr[^\s]+' | sort -u)
          echo "$attendues"
          for img in $attendues; do
            # Le nom doit être « ghcr.io/<owner>/eventhub-<service>:<tag> » :
            # exactement deux segments après le domaine.
            n=$(echo "${img%%:*}" | awk -F/ '{print NF}')
            if [ "$n" -ne 3 ]; then
              echo "::error::Nom d'image invalide : $img"
              echo "::error::Attendu ghcr.io/<owner>/eventhub-<service> — vérifier REGISTRY"
              exit 1
            fi
          done
          echo "✅ noms d'images conformes"

      - name: Déploiement depuis les images publiées
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

      - name: Attente que la pile soit saine
        run: |
          for i in $(seq 1 40); do
            n=$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps \
                  --format '{{.Health}}' | grep -c healthy || true)
            echo "conteneurs sains : $n/6"
            [ "$n" -ge 6 ] && exit 0
            sleep 5
          done
          echo "::error::La pile n'est pas devenue saine dans le temps imparti"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=40
          exit 1

      # Un déploiement « réussi » sur une application morte est pire que
      # pas de déploiement du tout : on vérifie le comportement réel.
      - name: Tests de recette
        run: bash scripts/smoke-test.sh http://localhost:8080

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          docker compose -f docker-compose.yml -f docker-compose.prod.yml logs --tail=60

      - name: Arrêt de la pile
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.prod.yml down -v

      - name: Récapitulatif
        run: |
          {
            echo "## ✅ Déploiement vérifié"
            echo ""
            echo "Images publiées sur GHCR, pile démarrée et recette passée."
            echo ""
            echo "| Image | Tag |"
            echo "|---|---|"
            for s in events-service participants-service registrations-service frontend gateway; do
              echo "| \`${{ env.GHCR_HOST }}/${{ env.IMAGE_PREFIX }}-$s\` | \`latest\`, \`sha-${GITHUB_SHA:0:7}\` |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

