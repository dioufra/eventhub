name: CI

# Toutes les branches sauf main (main est traité par cd.yml, plus tard).
on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [develop, main]

# Annule le run précédent si un nouveau push arrive sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ===========================================================================
  # JOB 1 — Configuration d'orchestration
  # ===========================================================================
  compose:
    name: Configuration Compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validation de docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config > /dev/null
          echo "✅ configuration valide (base + override)"

      - name: Un seul port publié en mode production
        run: |
          cp .env.example .env
          n=$(docker compose -f docker-compose.yml config | grep -c 'published:' || true)
          echo "Ports publiés hors développement : $n"
          if [ "$n" -ne 1 ]; then
            echo "::error::$n ports publiés — seule la gateway doit en exposer un"
            exit 1
          fi

      - name: Le script d'initialisation crée bien 3 bases
        run: |
          n=$(grep -ci '^CREATE DATABASE' infra/postgres/init/01-create-databases.sql || true)
          echo "CREATE DATABASE trouvés : $n"
          test "$n" -eq 3

  # ===========================================================================
  # JOB 2 — Tests unitaires des microservices
  #
  # Chaque service est testé DÈS QU'IL EST IMPLÉMENTÉ. Tant que son code
  # est vide, l'étape est ignorée avec un message, sans faire échouer la CI.
  # Aucune modification de ce fichier ne sera nécessaire quand Berly, Kra
  # et Mohamed livreront leur service.
  # ===========================================================================
  backend:
    name: Tests · ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - events-service
          - participants-service
          - registrations-service

    steps:
      - uses: actions/checkout@v4

      - name: Le service est-il implémenté ?
        id: check
        run: |
          if [ -s "${{ matrix.service }}/requirements-dev.txt" ] && \
             [ -s "${{ matrix.service }}/app/main.py" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }} pas encore implémenté — tests ignorés"
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements-dev.txt

      - name: Installation des dépendances
        if: steps.check.outputs.ready == 'true'
        working-directory: ${{ matrix.service }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Tests unitaires
        if: steps.check.outputs.ready == 'true'
        working-directory: ${{ matrix.service }}
        run: pytest -v

  # ===========================================================================
  # JOB 3 — Frontend Angular
  # ===========================================================================
  frontend:
    name: Build Angular
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Le projet Angular existe-t-il ?
        id: check
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend pas encore généré (ng new) — build ignoré"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm ci --legacy-peer-deps

      - name: Compilation de production
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: npm run build -- --configuration=production

      # Le piège n°1 d'Angular en conteneur : le chemin de sortie du build.
      - name: Vérification du chemin de sortie
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: |
          find dist -name index.html
          test -f dist/frontend/browser/index.html || {
            echo "::error::Chemin de build inattendu — corriger le COPY du Dockerfile"
            exit 1
          }

  # ===========================================================================
  # JOB 4 — Construction des images (validation, sans publication)
  # ===========================================================================
  images:
    name: Image · ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [compose]
    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - frontend
          - events-service
          - participants-service
          - registrations-service

    steps:
      - uses: actions/checkout@v4

      - name: Le Dockerfile est-il prêt ?
        id: check
        run: |
          if [ -s "${{ matrix.service }}/Dockerfile" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${{ matrix.service }}/Dockerfile vide — build ignoré"
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.ready == 'true'

      - name: Construction
        if: steps.check.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: false
          load: true
          tags: eventhub-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
