# =============================================================================
#  Gateway EventHub — routage vers le frontend et les trois microservices
# =============================================================================
upstream frontend_app       { server frontend:80; }
upstream events_api         { server events-service:8001; }
upstream participants_api   { server participants-service:8002; }
upstream registrations_api  { server registrations-service:8003; }

server {
    listen 80;
    server_name _;

    access_log /dev/stdout;
    error_log  /dev/stderr warn;

    client_max_body_size 2m;
    server_tokens off;

    # ---- En-têtes de sécurité, appliqués à TOUT le trafic ----------------
    add_header X-Frame-Options        "SAMEORIGIN"                 always;
    add_header X-Content-Type-Options "nosniff"                    always;
    add_header Referrer-Policy        "no-referrer-when-downgrade" always;

    # ---- Santé de la gateway elle-même -----------------------------------
    location = /gateway-health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "gateway ok\n";
    }

    # ---- Routage des API --------------------------------------------------
    location /api/events {
        proxy_pass http://events_api;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/participants {
        proxy_pass http://participants_api;
        include /etc/nginx/proxy_common.conf;
    }

    location /api/registrations {
        proxy_pass http://registrations_api;
        include /etc/nginx/proxy_common.conf;
    }

    # ---- Tout le reste part vers le frontend ------------------------------
    location / {
        proxy_pass http://frontend_app;
        include /etc/nginx/proxy_common.conf;
    }
}